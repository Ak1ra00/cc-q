# Publishes the website (docs/) to GitHub Pages.
#
# GitHub's own "deploy from a branch" build clones every submodule, and one deep
# inside MicroPython (lib/lwip, on git.savannah.gnu.org) cannot be cloned the way
# it asks, so that build always fails. This uploads docs/ as it is instead, with no
# submodules. In Settings -> Pages, Source must be "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
